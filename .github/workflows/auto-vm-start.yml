name: Start Azure VMs Daily

on:
  push:
    branches:
      - cronjob
  # schedule:
  #   - cron: '0 7 * * 1-5' # weekdays at 7:00 UTC
  workflow_dispatch:

jobs:
  auto-vm-start:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set debug environment variable
        run: echo "AZURE_ARM_DEPLOY_LOG_LEVEL=debug" >> $GITHUB_ENV

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_BVT }}

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Start VMs from config
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "Reading VM config..."
            VMS=$(cat vmList.json)
            COUNT=$(echo "$VMS" | jq length)

            for i in $(seq 0 $((COUNT - 1))); do
              NAME=$(echo "$VMS" | jq -r ".[$i].name")
              RG=$(echo "$VMS" | jq -r ".[$i].resourceGroup")
              echo "Starting VM: $NAME in Resource Group: $RG"
              az vm start --resource-group "$RG" --name "$NAME"
            done
